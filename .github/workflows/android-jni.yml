name: Android ARM64 JNI
on:
  push:
    branches:
      - android-arm64-neoforge-1.21.1
    paths:
      - '.github/workflows/android-jni.yml'
      - 'buildSrc/android-jni/**'
      - 'buildSrc/scripts/build-android-jni.sh'
  workflow_dispatch:

jobs:
  build-android-jni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ImGuiMC fork
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls -la "$ANDROID_HOME/ndk" || true
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          else
            echo "No preinstalled Android NDK found" >&2
            exit 1
          fi
      - name: Build Android ARM64 JNI
        run: bash buildSrc/scripts/build-android-jni.sh
      - name: Upload Android JNI jar
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-natives-android-arm64
          path: build/imgui-java-natives-android-arm64.jar
          if-no-files-found: error
